services:
  backend:
    build: ./pet-points-back
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      URL_BASE_MERCADO_PAGO: ${URL_BASE_MERCADO_PAGO}
      PUBLIC_KEY_MERCADO_PAGO: ${PUBLIC_KEY_MERCADO_PAGO}
      ACCESS_TOKEN_MERCADO_PAGO: ${ACCESS_TOKEN_MERCADO_PAGO}
      PUBLIC_KEY_STRIPE: ${PUBLIC_KEY_STRIPE}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}
      LOCAL_CLINICA: ${LOCAL_CLINICA}
      APP_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      PORT: 8080
    expose:
      - "8080"

  frontend:
    build: ./pet-points-front
    expose:
      - "80"
